// ========== STATE ==========
let cart = {};

// ========== RENDER PRODUCTS ==========
function renderProducts() {
  const container = document.getElementById('product-list');
  let html = '';

  Object.entries(PRODUCTS).forEach(([pid, p]) => {
    const qty = cart[pid] || 0;
    const savings = p.originalPrice - p.price;

    html += `
      <div class="product-card bg-white border border-gray-100 rounded-3xl p-5 flex gap-4">
        <img src="${p.image}" class="w-20 h-20 object-cover rounded-2xl" alt="${p.name}">
        <div class="flex-1">
          <div class="flex justify-between">
            <h3 class="font-semibold text-base">${p.name}</h3>
            ${p.bestSeller ? `<span class="text-[10px] bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full">Best Seller</span>` : ''}
          </div>
          <p class="text-xs text-gray-500 mt-1 line-clamp-2">${p.desc}</p>
          <div class="mt-3 flex items-center gap-2">
            <span class="text-2xl font-bold text-green-700">৳${p.price}</span>
            ${savings > 0 ? `<span class="text-sm line-through text-gray-400">৳${p.originalPrice}</span>` : ''}
          </div>
          <p class="text-xs text-orange-600 mt-1">ডেলিভারি: ৳${p.delivery}</p>

          ${qty > 0 ? `
            <div class="flex items-center gap-3 mt-4 bg-gray-50 w-fit rounded-2xl p-1">
              <button onclick="adjustQty('${pid}', -1)" class="w-9 h-9 hover:bg-white rounded-xl text-xl font-medium text-green-700">-</button>
              <span class="font-semibold w-10 text-center">${qty}</span>
              <button onclick="adjustQty('${pid}', 1)" class="w-9 h-9 hover:bg-white rounded-xl text-xl font-medium text-green-700">+</button>
            </div>
          ` : `
            <button onclick="addToCart('${pid}')" class="mt-4 bg-green-700 hover:bg-green-800 text-white px-6 py-2.5 rounded-2xl text-sm font-medium">যোগ করুন</button>
          `}
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
  updateSummary();
}

// ========== CART FUNCTIONS ==========
function addToCart(pid) {
  cart[pid] = (cart[pid] || 0) + 1;
  renderProducts();
  toast(`${PRODUCTS[pid].name} যোগ হয়েছে`, false);
}

function adjustQty(pid, delta) {
  let qty = (cart[pid] || 0) + delta;
  if (qty <= 0) delete cart[pid];
  else cart[pid] = qty;
  renderProducts();
}

function getTotals() {
  let subtotal = 0;
  let totalDelivery = 0;

  Object.entries(cart).forEach(([pid, qty]) => {
    const p = PRODUCTS[pid];
    if (p) {
      subtotal += p.price * qty;
      totalDelivery += p.delivery * qty;
    }
  });

  const discount = 0;
  const total = subtotal + totalDelivery - discount;

  return { subtotal, delivery: totalDelivery, discount, total };
}

function updateSummary() {
  const { subtotal, delivery, discount, total } = getTotals();
  const hasItems = Object.keys(cart).length > 0;

  const summaryEl = document.getElementById('summary-items');
  if (!hasItems) {
    summaryEl.innerHTML = `<p class="text-center text-gray-500 py-8">কোনো পণ্য নির্বাচন করা হয়নি</p>`;
  } else {
    let html = '';
    Object.entries(cart).forEach(([pid, qty]) => {
      const p = PRODUCTS[pid];
      html += `<div class="flex justify-between text-sm"><span>${p.name} × ${qty}</span><span>৳${p.price * qty}</span></div>`;
    });
    summaryEl.innerHTML = html;
  }

  document.getElementById('subtotal').textContent = subtotal;
  document.getElementById('delivery').textContent = delivery;
  document.getElementById('discount').textContent = discount;
  document.getElementById('total').textContent = total;

  document.getElementById('pay-btn').disabled = !hasItems;
}

// ========== DISTRICT & THANA ==========
function populateDistricts() {
  const select = document.getElementById('district');
  Object.keys(THANAS).sort().forEach(d => {
    const opt = document.createElement('option');
    opt.value = d; 
    opt.textContent = d;
    select.appendChild(opt);
  });
}

function populateThanas() {
  const district = document.getElementById('district').value;
  const thanaSelect = document.getElementById('thana');
  thanaSelect.innerHTML = '<option value="">থানা নির্বাচন করুন</option>';
  thanaSelect.disabled = true;

  if (district && THANAS[district]) {
    THANAS[district].forEach(thana => {
      const opt = document.createElement('option');
      opt.value = thana; 
      opt.textContent = thana;
      thanaSelect.appendChild(opt);
    });
    thanaSelect.disabled = false;
  }
}

// ========== PAYMENT ==========
async function processPayment() {
  if (Object.keys(cart).length === 0) return toast('প্রথমে পণ্য নির্বাচন করুন', true);

  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  let email = document.getElementById('email').value.trim();
  const district = document.getElementById('district').value;
  const thana = document.getElementById('thana').value;
  const address = document.getElementById('address').value.trim();

  // Set default email if not provided
  if (!email) {
    email = "noemail@urboressentials.com";
  }

  if (!name || !phone || !district || !thana || !address) {
    return toast('সব তথ্য পূরণ করুন', true);
  }

  const phoneRegex = /^01[0-9]{9}$/;
  if (!phoneRegex.test(phone.replace(/\s/g, ''))) {
    return toast('সঠিক মোবাইল নম্বর দিন (01XXXXXXXXX)', true);
  }

  const { total } = getTotals();

  const payload = {
    items: Object.entries(cart).map(([pid, qty]) => ({ id: pid, qty: qty })),
    cust_name: name,
    cust_phone: phone,
    cust_email: email,
    jela: district,
    thana: thana,
    address_detail: address,
    event_id: 'order-' + Date.now()
  };

  const btn = document.getElementById('pay-btn');
  const originalText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = 'প্রসেসিং...';

  try {
    const res = await fetch('/api/initiate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = { error: text || 'Unknown error' }; }

    if (res.ok && data.payment_url) {
      window.location.href = data.payment_url;
    } else {
      toast(data.error || 'পেমেন্ট শুরু করতে সমস্যা হয়েছে', true);
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  } catch (e) {
    toast('নেটওয়ার্ক সমস্যা হয়েছে', true);
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
}

function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3.5 rounded-3xl text-sm shadow-2xl text-white ${isError ? 'bg-red-600' : 'bg-emerald-700'}`;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 3000);
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  renderProducts();
  populateDistricts();

  document.getElementById('phone').addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '').slice(0, 11);
  });
});
</script>
