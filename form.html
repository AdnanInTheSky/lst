<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Urbor Essentials — প্রিমিয়াম আমের অর্ডার</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#166534', accent: '#4ade80' },
          fontFamily: {
            bengali: ['"Noto Sans Bengali"', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Noto Sans Bengali', 'Inter', sans-serif; background: linear-gradient(to bottom, #f8fafc, #f1f5f9); }
    .product-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
    .pay-btn { position: relative; overflow: hidden; }
    .pay-btn::after {
      content: ''; position: absolute; top: -50%; left: -50%; width: 40%; height: 200%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
      transform: skewX(-25deg); animation: shimmer 4s infinite;
    }
    @keyframes shimmer { 100% { transform: translateX(400%); } }
  </style>
</head>
<body class="min-h-screen pb-24">

<header class="sticky top-0 z-50 bg-white border-b shadow-sm">
  <div class="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div>
        <div class="font-serif text-2xl font-semibold">Urbor Essentials</div>
        <p class="text-xs text-emerald-700 -mt-1">রাজশাহীর প্রাকৃতিক আম</p>
      </div>
    </div>
    <a href="tel:01794449607" class="flex items-center gap-2 text-sm font-medium bg-green-50 text-green-700 px-5 py-2.5 rounded-3xl">📞 01794-449607</a>
  </div>
</header>

<main class="max-w-2xl mx-auto px-4 pt-6 space-y-6">

  <!-- Products -->
  <section class="bg-white rounded-3xl shadow border border-gray-100 p-6">
    <h2 class="text-xl font-semibold mb-5 flex items-center gap-3">
      <span class="bg-green-100 text-green-700 w-8 h-8 rounded-2xl flex items-center justify-center text-sm font-bold">১</span>
      পণ্য নির্বাচন করুন
    </h2>
    <div id="product-list" class="space-y-4"></div>
  </section>

  <!-- Order Summary -->
  <section class="bg-white rounded-3xl shadow border border-gray-100 p-6">
    <h2 class="text-xl font-semibold mb-5 flex items-center gap-3">
      <span class="bg-green-100 text-green-700 w-8 h-8 rounded-2xl flex items-center justify-center text-sm font-bold">২</span>
      অর্ডার সামারি
    </h2>
    <div id="summary-items" class="space-y-3"></div>
    
    <div class="border-t pt-5 mt-4 space-y-2.5 text-[15px]">
      <div class="flex justify-between"><span class="text-gray-600">সাবটোটাল</span><span>৳<span id="subtotal">0</span></span></div>
      <div class="flex justify-between"><span class="text-gray-600">ডেলিভারি চার্জ</span><span class="text-orange-600 font-medium">৳<span id="delivery">0</span></span></div>
      <div class="flex justify-between"><span class="text-gray-600">ডিসকাউন্ট</span><span class="text-emerald-600">-৳<span id="discount">0</span></span></div>
      <div class="flex justify-between text-xl font-bold pt-4 border-t">
        <span>মোট</span>
        <span class="text-green-700">৳<span id="total">0</span></span>
      </div>
    </div>
  </section>

  <!-- Shipping -->
  <section class="bg-white rounded-3xl shadow border border-gray-100 p-6">
    <h2 class="text-xl font-semibold mb-5 flex items-center gap-3">
      <span class="bg-green-100 text-green-700 w-8 h-8 rounded-2xl flex items-center justify-center text-sm font-bold">৩</span>
      ডেলিভারি তথ্য
    </h2>
    <form id="shipping-form" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">পুরো নাম *</label>
        <input id="name" type="text" required class="w-full px-4 py-3.5 rounded-2xl border border-gray-200 focus:border-green-600 outline-none text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">মোবাইল নম্বর *</label>
        <div class="flex">
          <span class="bg-gray-100 px-5 flex items-center border border-r-0 border-gray-200 rounded-l-2xl">+88</span>
          <input id="phone" type="tel" maxlength="11" required class="flex-1 px-4 py-3.5 rounded-r-2xl border border-gray-200 focus:border-green-600 outline-none text-sm">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ইমেইল (ঐচ্ছিক)</label>
        <input id="email" type="email" class="w-full px-4 py-3.5 rounded-2xl border border-gray-200 focus:border-green-600 outline-none text-sm">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">জেলা *</label>
          <select id="district" onchange="populateThanas()" required class="w-full px-4 py-3.5 rounded-2xl border border-gray-200 focus:border-green-600 outline-none text-sm">
            <option value="">জেলা নির্বাচন করুন</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">থানা *</label>
          <select id="thana" required class="w-full px-4 py-3.5 rounded-2xl border border-gray-200 focus:border-green-600 outline-none text-sm" disabled>
            <option value="">প্রথমে জেলা নির্বাচন করুন</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">বিস্তারিত ঠিকানা *</label>
        <textarea id="address" rows="3" required class="w-full px-4 py-3.5 rounded-3xl border border-gray-200 focus:border-green-600 outline-none resize-none text-sm"></textarea>
      </div>
    </form>
  </section>

</main>

<!-- Fixed Pay Button -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t max-w-2xl mx-auto p-4 z-50 shadow-2xl">
  <button id="pay-btn" onclick="processPayment()" class="pay-btn w-full bg-gradient-to-r from-green-700 to-emerald-600 text-white py-4 rounded-3xl font-semibold text-lg active:scale-95 transition-all flex items-center justify-center gap-2">
    অর্ডার কনফার্ম করুন →
  </button>
  <p class="text-center text-xs text-gray-500 mt-3">🔒 SSL Secure Payment</p>
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3.5 rounded-3xl text-sm shadow-2xl text-white"></div>

<script>
// ========== PRODUCTS (Your Updated Data) ==========
const PRODUCTS = {
  p1: { name: "হিমসাগর আম — প্রিমিয়াম", price: 180, delivery: 80, originalPrice: 220, image: "https://lst-mu.vercel.app/images/image.png", desc: "রাজশাহীর বিখ্যাত হিমসাগর, মিষ্টি ও সুগন্ধি। প্রতি কেজি।", label: "Best Selling", bestSeller: true },
  p2: { name: "ল্যাংড়া আম", price: 220, delivery: 80, originalPrice: 280, image: "https://lst-mu.vercel.app/images/image.png", desc: "রাজশাহীর ঐতিহ্যবাহী ল্যাংড়া, টক-মিষ্টি স্বাদ। প্রতি কেজি।", label: "Best Selling", bestSeller: true },
  p3: { name: "ফজলি আম", price: 200, delivery: 90, originalPrice: 250, image: "https://lst-mu.vercel.app/images/image.png", desc: "বড় আকারের ফজলি, রাজশাহীর সেরা বাগান থেকে।", label: "Best Selling", bestSeller: true },
  p4: { name: "আম্রপালি আম", price: 250, delivery: 80, originalPrice: 300, image: "https://lst-mu.vercel.app/images/image.png", desc: "মিষ্টি ও রসালো আম্রপালি, প্রতি কেজি।", label: "Best Selling", bestSeller: true },
  p5: { name: "হিমসাগর — ফ্যামিলি প্যাক", price: 850, delivery: 150, originalPrice: 1100, image: "https://lst-mu.vercel.app/images/image.png", desc: "৫ কেজি ফ্যামিলি প্যাক, বিশেষ ডিসকাউন্টে।", label: "", bestSeller: false },
  p6: { name: "আমের আচার — হাতে তৈরি", price: 350, delivery: 60, originalPrice: 420, image: "https://lst-mu.vercel.app/images/image.png", desc: "পাকা আমের ঐতিহ্যবাহী আচার, কোনো প্রিজারভেটিভ নেই। ৫০০গ্রাম।", label: "Best Selling", bestSeller: true },
  p7: { name: "আমের জুস — তাজা", price: 180, delivery: 70, originalPrice: 220, image: "https://lst-mu.vercel.app/images/image.png", desc: "তাজা রাজশাহী আমের জুস, কোনো চিনি মিশ্রিত নয়। ১ লিটার।", label: "", bestSeller: false },
  p8: { name: "আমের সরবত কনসেনট্রেট", price: 280, delivery: 60, originalPrice: 350, image: "https://lst-mu.vercel.app/images/image.png", desc: "ঘন সরবত কনসেনট্রেট, পানিতে মিশিয়ে খান। ৫০০মিলি।", label: "Best Selling", bestSeller: true },
};

// ========== THANAS (Shortened for brevity - add full if needed) ==========
const THANAS = {
  "Bagerhat": ["Bagerhat Sadar", "Chitalmari", "Fakirhat", "Kachua", "Mollahat", "Mongla", "Morrelganj", "Rampal", "Sarankhola"],
  "Bandarban": ["Alikadam", "Bandarban Sadar", "Lama", "Naikhongchhari", "Rowangchhari", "Ruma", "Thanchi"],
  "Barguna": ["Amtali", "Bamna", "Barguna Sadar", "Betagi", "Pathorghata", "Taltali"],
  "Barisal": ["Agailjhara", "Babuganj", "Bakerganj", "Banaripara", "Barisal Sadar", "Gournadi", "Hizla", "Kotwali", "Mehendiganj", "Muladi", "Wazirpur"],
  "Bhola": ["Bhola Sadar", "Borhanuddin", "Charfesson", "Doulatkhan", "Lalmohan", "Monpura", "Tazumuddin"],
  "Bogura": ["Bogra Sadar", "Adamdighi", "Dhunot", "Gabtali", "Sherpur", "Shibganj"],
  "Brahmanbaria": ["Brahmanbaria Sadar", "Akhaura", "Ashuganj", "Kasba", "Nabinagar"],
  "Chandpur": ["Chandpur Sadar", "Faridgonj", "Hajiganj", "Kachua", "Shahrasti"],
  "Chattogram": ["Kotwali", "Agrabad", "Panchlaish", "Hathazari", "Patiya", "Raozan", "Sitakunda"],
  "Comilla": ["Comilla Sadar", "Barura", "Chandina", "Daudkandi", "Laksam", "Muradnagar"],
  "Coxsbazar": ["Coxsbazar Sadar", "Chakaria", "Moheshkhali", "Ramu", "Teknaf", "Ukhiya"],
  "Dhaka": ["Dhanmondi", "Gulshan", "Mirpur", "Uttara", "Mohammadpur", "Banani", "Badda", "Savar", "Jatrabari", "Demra"],
  "Dinajpur": ["Dinajpur Sadar", "Birganj", "Parbatipur"],
  "Faridpur": ["Faridpur Sadar", "Bhanga", "Boalmari"],
  "Feni": ["Feni Sadar", "Daganbhuiyan", "Sonagazi"],
  "Gazipur": ["Gazipur Sadar", "Joydevpur", "Kaliakair", "Sreepur", "Tongi"],
  "Khulna": ["Khulna Sadar", "Sonadanga", "Daulatpur", "Rupsha"],
  "Mymensingh": ["Mymensingh Sadar", "Muktagacha", "Gafargaon", "Trishal"],
  "Narayanganj": ["Narayanganj Sadar", "Bandar", "Rupganj", "Sonargaon"],
  "Rajshahi": ["Rajshahi Sadar", "Boalia", "Motihar", "Paba", "Godagari"],
  "Rangpur": ["Rangpur Sadar", "Kotowali", "Mithapukur", "Gangachara"],
  "Sylhet": ["Sylhet Sadar", "Kotwali", "Jalalabad", "Beanibazar", "Golapganj"],
};
// ========== STATE ==========
let cart = {};

// ========== RENDER PRODUCTS ==========
function renderProducts() {
  const container = document.getElementById('product-list');
  let html = '';

  Object.entries(PRODUCTS).forEach(([pid, p]) => {
    const qty = cart[pid] || 0;
    const savings = p.originalPrice - p.price;

    html += `
      <div class="product-card bg-white border border-gray-100 rounded-3xl p-5 flex gap-4">
        <img src="${p.image}" class="w-20 h-20 object-cover rounded-2xl" alt="${p.name}">
        <div class="flex-1">
          <div class="flex justify-between">
            <h3 class="font-semibold text-base">${p.name}</h3>
            ${p.bestSeller ? `<span class="text-[10px] bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full">Best Seller</span>` : ''}
          </div>
          <p class="text-xs text-gray-500 mt-1 line-clamp-2">${p.desc}</p>
          <div class="mt-3 flex items-center gap-2">
            <span class="text-2xl font-bold text-green-700">৳${p.price}</span>
            ${savings > 0 ? `<span class="text-sm line-through text-gray-400">৳${p.originalPrice}</span>` : ''}
          </div>
          <p class="text-xs text-orange-600 mt-1">ডেলিভারি: ৳${p.delivery}</p>

          ${qty > 0 ? `
            <div class="flex items-center gap-3 mt-4 bg-gray-50 w-fit rounded-2xl p-1">
              <button onclick="adjustQty('${pid}', -1)" class="w-9 h-9 hover:bg-white rounded-xl text-xl font-medium text-green-700">-</button>
              <span class="font-semibold w-10 text-center">${qty}</span>
              <button onclick="adjustQty('${pid}', 1)" class="w-9 h-9 hover:bg-white rounded-xl text-xl font-medium text-green-700">+</button>
            </div>
          ` : `
            <button onclick="addToCart('${pid}')" class="mt-4 bg-green-700 hover:bg-green-800 text-white px-6 py-2.5 rounded-2xl text-sm font-medium">যোগ করুন</button>
          `}
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
  updateSummary();
}

// ========== CART & TOTALS ==========
function addToCart(pid) {
  cart[pid] = (cart[pid] || 0) + 1;
  renderProducts();
  toast(`${PRODUCTS[pid].name} যোগ হয়েছে`, false);
}

function adjustQty(pid, delta) {
  let qty = (cart[pid] || 0) + delta;
  if (qty <= 0) delete cart[pid];
  else cart[pid] = qty;
  renderProducts();
}

function getTotals() {
  let subtotal = 0;
  let totalDelivery = 0;

  Object.entries(cart).forEach(([pid, qty]) => {
    const p = PRODUCTS[pid];
    if (p) {
      subtotal += p.price * qty;
      totalDelivery += p.delivery * qty;
    }
  });

  const discount = 0;
  const total = subtotal + totalDelivery - discount;

  return { subtotal, delivery: totalDelivery, discount, total };
}

function updateSummary() {
  const { subtotal, delivery, discount, total } = getTotals();
  const hasItems = Object.keys(cart).length > 0;

  const summaryEl = document.getElementById('summary-items');
  if (!hasItems) {
    summaryEl.innerHTML = `<p class="text-center text-gray-500 py-8">কোনো পণ্য নির্বাচন করা হয়নি</p>`;
  } else {
    let html = '';
    Object.entries(cart).forEach(([pid, qty]) => {
      const p = PRODUCTS[pid];
      html += `
        <div class="flex justify-between text-sm">
          <span>${p.name} × ${qty}</span>
          <span>৳${p.price * qty}</span>
        </div>
      `;
    });
    summaryEl.innerHTML = html;
  }

  document.getElementById('subtotal').textContent = subtotal;
  document.getElementById('delivery').textContent = delivery;
  document.getElementById('discount').textContent = discount;
  document.getElementById('total').textContent = total;

  document.getElementById('pay-btn').disabled = !hasItems;
}

// ========== DISTRICT & THANA ==========
function populateDistricts() {
  const select = document.getElementById('district');
  Object.keys(THANAS).sort().forEach(d => {
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    select.appendChild(opt);
  });
}

function populateThanas() {
  const district = document.getElementById('district').value;
  const thanaSelect = document.getElementById('thana');
  thanaSelect.innerHTML = '<option value="">থানা নির্বাচন করুন</option>';
  thanaSelect.disabled = true;

  if (district && THANAS[district]) {
    THANAS[district].forEach(thana => {
      const opt = document.createElement('option');
      opt.value = thana; opt.textContent = thana;
      thanaSelect.appendChild(opt);
    });
    thanaSelect.disabled = false;
  }
}

// ========== PAYMENT (API Call Preserved) ==========
async function processPayment() {
  if (Object.keys(cart).length === 0) return toast('প্রথমে পণ্য নির্বাচন করুন', true);

  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const email = document.getElementById('email').value.trim();
  const district = document.getElementById('district').value;
  const thana = document.getElementById('thana').value;
  const address = document.getElementById('address').value.trim();

  if (!name || !phone || !district || !thana || !address) {
    return toast('সব প্রয়োজনীয় তথ্য পূরণ করুন', true);
  }

  const { total } = getTotals();

  const payload = {
    items: Object.entries(cart).map(([pid, qty]) => ({
      id: pid,
      name: PRODUCTS[pid].name,
      price: PRODUCTS[pid].price,
      qty: qty,
      delivery: PRODUCTS[pid].delivery
    })),
    customer: { name, phone, email: email || null },
    shipping: { district, thana, address },
    amount: total,
    event_id: 'order-' + Date.now()
  };

  const btn = document.getElementById('pay-btn');
  const originalText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = 'প্রসেসিং...';

  try {
    const res = await fetch('/api/initiate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (data.payment_url) {
      window.location.href = data.payment_url;
    } else {
      toast(data.error || 'পেমেন্ট শুরু করতে সমস্যা হয়েছে', true);
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  } catch (e) {
    toast('নেটওয়ার্ক সমস্যা হয়েছে', true);
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
}

function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3.5 rounded-3xl text-sm shadow-2xl text-white ${isError ? 'bg-red-600' : 'bg-emerald-700'}`;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 3000);
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  renderProducts();
  populateDistricts();

  document.getElementById('phone').addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '').slice(0, 11);
  });
});
</script>
</body>
</html>
