<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Urbor Essentials — অর্ডার করুন</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#166534', 'primary-dark': '#14532d', secondary: '#16a34a' },
          fontFamily: { bengali: ['"Noto Sans Bengali"', 'sans-serif'], serif: ['"Cormorant Garamond"', 'Georgia', 'serif'] }
        }
      }
    }
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <style>
    body { font-family: 'Noto Sans Bengali', sans-serif; background: #f9fafb; color: #1f2937; }
    input, select, textarea, button { font-family: 'Noto Sans Bengali', sans-serif; }
    .qty-btn { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 10px; transition: all 0.15s; cursor: pointer; user-select: none; }
    .qty-btn:hover { background: #f0fdf4; color: #166534; }
    .qty-btn:active { transform: scale(0.92); background: #dcfce7; }
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #166534; color: white; padding: 14px 32px; border-radius: 9999px; font-size: 14px; font-weight: 500; z-index: 200; transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); text-align: center; max-width: 90vw; white-space: nowrap; opacity: 0; pointer-events: none; }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #toast.err { background: #dc2626; }
    @media (max-width: 640px) { .hero-grid, .footer-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="min-h-screen flex flex-col">

<!-- HEADER -->
<header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-gray-200 shadow-sm">
  <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="https://mango-project-rho.vercel.app/static/images/logo.png" alt="Urbor Essentials" class="w-10 h-10 rounded-xl shadow" onerror="this.onerror=null;this.parentElement.innerHTML='<div class=\'w-10 h-10 bg-gradient-to-br from-green-700 to-emerald-600 rounded-xl flex items-center justify-center text-xl shadow-lg\'>🥭</div>'" />
      <div>
        <div class="font-serif text-lg font-semibold text-gray-900 tracking-tight">Urbor Essentials</div>
        <div class="text-xs text-gray-500 -mt-0.5">রাজশাহীর প্রাকৃতিক আম</div>
      </div>
    </div>
    <a href="tel:01822916488" class="flex items-center gap-1.5 text-sm font-semibold text-green-700 bg-green-50 px-3 py-1.5 rounded-lg border border-green-200 hover:bg-green-100 transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
      কল করুন
    </a>
  </div>
</header>

<!-- MAIN FORM -->
<main class="flex-grow py-6 md:py-10 px-4">
  <form id="order-form" class="max-w-4xl mx-auto space-y-8" onsubmit="return false;">
    
    <!-- Section 1: Product Selection -->
    <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm">
      <h2 class="font-serif text-xl font-semibold mb-5 text-gray-800 flex items-center gap-2 border-b pb-3">
        <span class="bg-green-100 text-green-700 w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold">1</span>
        পণ্য নির্বাচন করুন
      </h2>
      <div id="product-list" class="space-y-4"></div>
    </div>

    <!-- Section 2: Order Summary -->
    <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm">
      <h2 class="font-serif text-xl font-semibold mb-5 text-gray-800 flex items-center gap-2 border-b pb-3">
        <span class="bg-green-100 text-green-700 w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold">2</span>
        অর্ডার সারাংশ
      </h2>
      <div class="space-y-3 text-sm">
        <div class="flex justify-between text-gray-600"><span>পণ্যের মূল্য</span><span class="font-medium">৳<span id="subtotal">0</span></span></div>
        <div class="flex justify-between text-gray-600"><span>ডেলিভারি চার্জ</span><span class="font-medium">৳<span id="delivery-total">0</span></span></div>
        <div class="flex justify-between text-lg font-bold text-green-700 border-t border-dashed border-gray-200 pt-3 mt-2">
          <span>সর্বমোট পেমেন্ট</span>
          <span class="font-serif text-2xl">৳<span id="grand-total">0</span></span>
        </div>
      </div>
    </div>

    <!-- Section 3: Customer & Delivery Details -->
    <div class="bg-white rounded-2xl border border-gray-200 p-6 shadow-sm">
      <h2 class="font-serif text-xl font-semibold mb-5 text-gray-800 flex items-center gap-2 border-b pb-3">
        <span class="bg-green-100 text-green-700 w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold">3</span>
        আপনার তথ্য ও ডেলিভারি ঠিকানা
      </h2>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1.5">পুরো নাম *</label>
          <input type="text" id="name" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-gray-50" placeholder="আপনার নাম" required />
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1.5">ফোন নম্বর *</label>
            <input type="tel" id="phone" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-gray-50" placeholder="01XXXXXXXXX" maxlength="11" required />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1.5">ইমেইল *</label>
            <input type="email" id="email" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-gray-50" placeholder="you@example.com" required />
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1.5">জেলা *</label>
            <select id="district" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-gray-50" required>
              <option value="">জেলা নির্বাচন করুন</option>
              <!-- Populated via JS -->
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1.5">থানা *</label>
            <select id="thana" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-gray-50 disabled:bg-gray-100 disabled:cursor-not-allowed" disabled required>
              <option value="">প্রথমে জেলা নির্বাচন করুন</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1.5">বিস্তারিত ঠিকানা *</label>
          <textarea id="address" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition bg-gray-50 disabled:bg-gray-100 disabled:cursor-not-allowed" rows="3" placeholder="বাড়ি/হাউজ নং, রোড, ল্যান্ডমার্ক, পোস্ট কোড..." disabled required></textarea>
        </div>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="pb-12">
      <button type="button" id="pay-btn" class="w-full bg-green-800 text-white py-4 rounded-xl text-base font-semibold hover:bg-green-900 transition-all active:scale-[0.99] shadow-lg shadow-green-800/25 flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none" onclick="submitOrder()">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" stroke-width="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke-width="2"/></svg>
        PayStation-এ পেমেন্ট করুন
      </button>
      <p class="text-center text-xs text-gray-400 mt-3 flex items-center justify-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        SSL এনক্রিপ্টেড · নিরাপদ লেনদেন
      </p>
    </div>

  </form>
</main>

// ================= STATE =================
const quantities = {};

// ================= INIT =================
function init() {
  const listEl = document.getElementById('product-list');
  let html = '';
  
  // Render Products
  for (const [pid, p] of Object.entries(PRODUCTS)) {
    quantities[pid] = 0;
    html += `
      <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4 p-3 rounded-xl border border-gray-100 hover:bg-gray-50 transition">
        <img src="${p.image}" alt="${p.name}" class="w-20 h-20 sm:w-16 sm:h-16 object-contain rounded-lg bg-gray-50 flex-shrink-0" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjY2NjIiBzdHJva2Utd2lkdGg9IjIiPjxyZWN0IHg9IjMiIHk9IjMiIHdpZHRoPSIxOCIgaGVpZ2h0PSIxOCIgcng9IjIiLz48cGF0aCBkPSJNOSAyMWEzIDMgMCAwMC0zLTN2LTJoMTJ2MmEzIDMgMCAwMC0zIDNIMTJ6Ii8+PC9zdmc+'" />
        <div class="flex-1 min-w-0">
          <h3 class="font-medium text-gray-900 truncate">${p.name}</h3>
          <p class="text-xs text-gray-500 mb-1">${p.desc}</p>
          <div class="font-bold text-green-700">৳${p.price.toLocaleString('en-BD')}</div>
        </div>
        <div class="flex items-center gap-3 mt-2 sm:mt-0 bg-white px-3 py-2 rounded-xl border border-gray-200 shadow-sm flex-shrink-0">
          <button type="button" class="qty-btn text-gray-500 hover:text-green-700" onclick="changeQty('${pid}', -1)">−</button>
          <span id="qty-${pid}" class="w-8 text-center font-bold text-sm text-gray-800">0</span>
          <button type="button" class="qty-btn text-gray-500 hover:text-green-700" onclick="changeQty('${pid}', 1)">+</button>
        </div>
      </div>
    `;
  }
  listEl.innerHTML = html;

  // Populate Districts
  const distEl = document.getElementById('district');
  const sortedDistricts = Object.keys(THANAS_BY_DISTRICT).sort();
  sortedDistricts.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    distEl.appendChild(opt);
  });

  // Event Listeners
  document.getElementById('district').addEventListener('change', handleDistrictChange);
  document.getElementById('thana').addEventListener('change', handleThanaChange);
  document.getElementById('phone').addEventListener('input', (e) => { e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 11); });
  
  updateTotals();
}

// ================= LOGIC =================
function changeQty(pid, delta) {
  const next = (quantities[pid] || 0) + delta;
  if (next >= 0 && next <= 20) {
    quantities[pid] = next;
    document.getElementById(`qty-${pid}`).textContent = next;
    updateTotals();
  }
}

function updateTotals() {
  let subtotal = 0, delivery = 0;
  for (const [pid, qty] of Object.entries(quantities)) {
    if (qty > 0) {
      subtotal += PRODUCTS[pid].price * qty;
      delivery += PRODUCTS[pid].delivery * qty;
    }
  }
  document.getElementById('subtotal').textContent = subtotal.toLocaleString('en-BD');
  document.getElementById('delivery-total').textContent = delivery.toLocaleString('en-BD');
  document.getElementById('grand-total').textContent = (subtotal + delivery).toLocaleString('en-BD');
}

function handleDistrictChange(e) {
  const dist = e.target.value;
  const thanaEl = document.getElementById('thana');
  const addrEl = document.getElementById('address');
  
  thanaEl.innerHTML = '<option value="">থানা নির্বাচন করুন</option>';
  thanaEl.disabled = true;
  addrEl.disabled = true;
  addrEl.value = '';

  if (dist && THANAS_BY_DISTRICT[dist]) {
    THANAS_BY_DISTRICT[dist].forEach(t => {
      const opt = document.createElement('option');
      opt.value = t; opt.textContent = t;
      thanaEl.appendChild(opt);
    });
    thanaEl.disabled = false;
  }
}

function handleThanaChange(e) {
  const addrEl = document.getElementById('address');
  addrEl.disabled = !e.target.value;
  if (e.target.value) addrEl.focus();
}

// ================= SUBMIT =================
async function submitOrder() {
  const btn = document.getElementById('pay-btn');
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const email = document.getElementById('email').value.trim();
  const district = document.getElementById('district').value;
  const thana = document.getElementById('thana').value;
  const address = document.getElementById('address').value.trim();

  // Validation
  if (!name) return toast('নাম লিখুন', true);
  if (!/^01[3-9]\d{8}$/.test(phone)) return toast('সঠিক ফোন নম্বর দিন (01XXXXXXXXX)', true);
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('সঠিক ইমেইল দিন', true);
  if (!district) return toast('জেলা নির্বাচন করুন', true);
  if (!thana) return toast('থানা নির্বাচন করুন', true);
  if (!address) return toast('ঠিকানা লিখুন', true);

  // Check cart
  let items = [];
  let hasItems = false;
  for (const [pid, qty] of Object.entries(quantities)) {
    if (qty > 0) {
      items.push({ id: pid, qty });
      hasItems = true;
    }
  }
  if (!hasItems) return toast('অন্তত একটি পণ্য নির্বাচন করুন', true);

  // UI Loading
  btn.disabled = true;
  btn.innerHTML = `<span class="animate-pulse">সংযুক্ত হচ্ছে…</span>`;

  const payload = {
    items,
    cust_name: name,
    cust_phone: phone,
    cust_email: email,
    jela: district,
    thana: thana,
    address_detail: address,
    fbp: getCook('_fbp'),
    fbc: getCook('_fbc'),
    event_id: 'ic-' + Date.now()
  };

  try {
    const res = await fetch(`${API_BASE}/initiate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    
    if (data.payment_url) {
      window.location.href = data.payment_url;
    } else {
      toast(data.error || 'পেমেন্ট লিংক তৈরি হয়নি', true);
      resetBtn();
    }
  } catch (e) {
    toast('সার্ভারে সমস্যা হয়েছে। আবার চেষ্টা করুন।', true);
    resetBtn();
  }

  function resetBtn() {
    btn.disabled = false;
    btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" stroke-width="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4" stroke-width="2"/></svg> PayStation-এ পেমেন্ট করুন`;
  }
}

// ================= UTILS =================
function getCook(key) {
  const m = document.cookie.match(new RegExp('(^| )' + key + '=([^;]+)'));
  return m ? m[2] : null;
}
function toast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = err ? 'err' : '';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// Run
init();
</script>
