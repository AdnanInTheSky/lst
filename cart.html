<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>কার্ট — আমবাড়ি</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'mango-orange': '#E8910A',
            'mango-yellow': '#F4C430',
            'mango-ripe': '#FF9500',
            'leaf-green': '#1B4D1B',
            'leaf-light': '#2E7D32',
            'cream': '#FFF8E7',
            'cream-light': '#FFFBF0',
            'muted': '#8B6F47',
          },
          fontFamily: {
            bengali: ['Noto Sans Bengali', 'DM Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap');
    html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Noto Sans Bengali', 'DM Sans', sans-serif; }
    .form-input.error { border-color: #EF4444 !important; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15) !important; }
    .form-input.valid { border-color: #22C55E !important; }
    .form-hint { font-size: 0.75rem; margin-top: 0.25rem; }
    .form-hint.error { color: #EF4444; }
    .form-hint.valid { color: #22C55E; }
    button, a { touch-action: manipulation; }
    body { overflow-x: hidden; }

    /* Quantity stepper */
    .qty-btn {
      width: 36px; height: 36px;
      border: 2px solid #F5DEB3;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 1.1rem;
      color: #1B4D1B;
      transition: all 0.15s;
    }
    .qty-btn:hover { border-color: #E8910A; color: #E8910A; background: #FFF8E7; }
    .qty-btn:active { transform: scale(0.92); }
    .qty-value {
      min-width: 40px; text-align: center;
      font-weight: 800; font-size: 1rem;
      color: #1B4D1B;
    }

    /* Cart item card */
    .cart-item {
      background: white;
      border: 2px solid #F5DEB3;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      transition: all 0.2s;
    }
    .cart-item:hover { border-color: #E8910A; box-shadow: 0 8px 24px rgba(232,145,10,0.1); }

    @media (max-width: 640px) {
      .cart-item { flex-direction: column; align-items: stretch; gap: 12px; padding: 12px; }
      .cart-item .item-info { text-align: center; }
      .cart-item .item-actions { justify-content: center; }
    }
  </style>
<base target="_blank">
</head>
<body class="bg-cream text-[#2D1810] min-h-screen">

<!-- Header -->
<header class="sticky top-0 z-30 bg-cream/95 backdrop-blur-md border-b border-[#F5DEB3]">
  <div class="max-w-4xl mx-auto px-4 sm:px-8 h-[60px] sm:h-[72px] flex items-center justify-between">
    <a href="/" class="flex items-center gap-2 sm:gap-3 no-underline">
      <div class="w-9 h-9 sm:w-11 sm:h-11 bg-gradient-to-br from-mango-orange to-mango-yellow rounded-xl flex items-center justify-center text-lg sm:text-xl shadow-[0_2px_8px_rgba(232,145,10,0.12)]">🥭</div>
      <div>
        <div class="font-bengali text-base sm:text-xl font-bold text-leaf-green tracking-tight">আমবাড়ি</div>
        <div class="text-[0.65rem] sm:text-xs text-muted font-medium tracking-wider hidden sm:block">সাতক্ষীরার সেরা আম</div>
      </div>
    </a>
    <a href="/" class="text-sm sm:text-base text-muted hover:text-mango-orange transition-colors font-medium no-underline">← ফিরে যান</a>
  </div>
</header>

<!-- Main Content -->
<main class="max-w-4xl mx-auto px-4 sm:px-8 py-6 sm:py-10">

  <h1 class="font-bengali text-2xl sm:text-3xl font-bold text-leaf-green mb-2">🛒 আপনার কার্ট</h1>
  <p class="text-muted text-sm sm:text-base mb-6 sm:mb-8" id="cart-summary">কার্ট খালি</p>

  <!-- Cart Items -->
  <div id="cart-items" class="space-y-3 sm:space-y-4 mb-8 sm:mb-10">
    <!-- Items injected here -->
  </div>

  <!-- Empty State -->
  <div id="empty-state" class="text-center py-16 hidden">
    <div class="text-[5rem] mb-4">🥭</div>
    <p class="text-muted text-lg mb-4">আপনার কার্ট খালি</p>
    <a href="/" class="inline-flex items-center gap-2 bg-mango-orange text-white border-0 py-3 px-6 rounded-xl font-bold text-sm cursor-pointer transition-all duration-200 shadow-[0_4px_16px_rgba(232,145,10,0.3)] hover:bg-mango-ripe hover:translate-y-[-2px] no-underline">
      🛍️ কেনাকাটা করুন
    </a>
  </div>

  <!-- Order Summary + Checkout Form -->
  <div id="checkout-section" class="hidden">

    <!-- Order Summary Card -->
    <div class="bg-white border-2 border-[#F5DEB3] rounded-2xl p-5 sm:p-6 mb-6 sm:mb-8">
      <h2 class="font-bengali text-lg sm:text-xl font-bold text-leaf-green mb-4 pb-3 border-b-2 border-[#F5DEB3]">📋 অর্ডার সারাংশ</h2>
      <div id="summary-lines" class="space-y-2 mb-4"></div>
      <div class="flex justify-between items-center pt-4 border-t-2 border-[#F5DEB3]">
        <span class="font-bold text-leaf-green text-base sm:text-lg">মোট মূল্য</span>
        <span class="font-bengali text-2xl sm:text-3xl font-extrabold text-mango-orange">৳<span id="final-total">0</span></span>
      </div>
    </div>

    <!-- Checkout Form -->
    <div class="bg-white border-2 border-[#F5DEB3] rounded-2xl p-5 sm:p-6">
      <h2 class="font-bengali text-lg sm:text-xl font-bold text-leaf-green mb-5 pb-3 border-b-2 border-[#F5DEB3]">📝 চেকআউট</h2>

      <div class="grid gap-3 sm:gap-4">
        <div>
          <label class="text-[0.75rem] sm:text-[0.8rem] font-bold tracking-wide uppercase text-muted mb-1.5 block">পুরো নাম *</label>
          <input class="form-input w-full bg-cream-light border-2 border-[#F5DEB3] rounded-xl px-4 py-3 font-inherit text-sm sm:text-base text-[#2D1810] outline-none transition-all duration-200 focus:border-mango-orange focus:shadow-[0_0_0_4px_rgba(232,145,10,0.1)] placeholder-[#C4B5A0]" id="f-name" placeholder="রহিম উদ্দিন" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
          <div>
            <label class="text-[0.75rem] sm:text-[0.8rem] font-bold tracking-wide uppercase text-muted mb-1.5 block">ফোন নম্বর *</label>
            <input class="form-input w-full bg-cream-light border-2 border-[#F5DEB3] rounded-xl px-4 py-3 font-inherit text-sm sm:text-base text-[#2D1810] outline-none transition-all duration-200 focus:border-mango-orange focus:shadow-[0_0_0_4px_rgba(232,145,10,0.1)] placeholder-[#C4B5A0]" id="f-phone" placeholder="01XXXXXXXXX" maxlength="11" inputmode="numeric" />
            <div class="form-hint" id="hint-phone"></div>
          </div>
          <div>
            <label class="text-[0.75rem] sm:text-[0.8rem] font-bold tracking-wide uppercase text-muted mb-1.5 block">ইমেইল *</label>
            <input class="form-input w-full bg-cream-light border-2 border-[#F5DEB3] rounded-xl px-4 py-3 font-inherit text-sm sm:text-base text-[#2D1810] outline-none transition-all duration-200 focus:border-mango-orange focus:shadow-[0_0_0_4px_rgba(232,145,10,0.1)] placeholder-[#C4B5A0]" id="f-email" type="email" placeholder="you@example.com" inputmode="email" />
            <div class="form-hint" id="hint-email"></div>
          </div>
        </div>

        <div class="text-[0.75rem] sm:text-[0.8rem] font-bold tracking-wider uppercase text-leaf-green py-3 pb-2 border-t-2 border-[#F5DEB3] mt-2">📍 ডেলিভারি ঠিকানা</div>

        <div class="grid grid-cols-2 gap-3 sm:gap-4">
          <div>
            <label class="text-[0.75rem] sm:text-[0.8rem] font-bold tracking-wide uppercase text-muted mb-1.5 block">বিভাগ *</label>
            <input class="form-input w-full bg-cream-light border-2 border-[#F5DEB3] rounded-xl px-4 py-3 font-inherit text-sm sm:text-base text-[#2D1810] outline-none transition-all duration-200 focus:border-mango-orange focus:shadow-[0_0_0_4px_rgba(232,145,10,0.1)] placeholder-[#C4B5A0]" id="f-division" placeholder="যেমন: ঢাকা" />
          </div>
          <div>
            <label class="text-[0.75rem] sm:text-[0.8rem] font-bold tracking-wide uppercase text-muted mb-1.5 block">জেলা *</label>
            <input class="form-input w-full bg-cream-light border-2 border-[#F5DEB3] rounded-xl px-4 py-3 font-inherit text-sm sm:text-base text-[#2D1810] outline-none transition-all duration-200 focus:border-mango-orange focus:shadow-[0_0_0_4px_rgba(232,145,10,0.1)] placeholder-[#C4B5A0]" id="f-jela" placeholder="যেমন: সাতক্ষীরা" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 sm:gap-4">
          <div>
            <label class="text-[0.75rem] sm:text-[0.8rem] font-bold tracking-wide uppercase text-muted mb-1.5 block">উপজেলা *</label>
            <input class="form-input w-full bg-cream-light border-2 border-[#F5DEB3] rounded-xl px-4 py-3 font-inherit text-sm sm:text-base text-[#2D1810] outline-none transition-all duration-200 focus:border-mango-orange focus:shadow-[0_0_0_4px_rgba(232,145,10,0.1)] placeholder-[#C4B5A0]" id="f-upojela" placeholder="যেমন: তালা" />
          </div>
          <div>
            <label class="text-[0.75rem] sm:text-[0.8rem] font-bold tracking-wide uppercase text-muted mb-1.5 block">থানা *</label>
            <input class="form-input w-full bg-cream-light border-2 border-[#F5DEB3] rounded-xl px-4 py-3 font-inherit text-sm sm:text-base text-[#2D1810] outline-none transition-all duration-200 focus:border-mango-orange focus:shadow-[0_0_0_4px_rgba(232,145,10,0.1)] placeholder-[#C4B5A0]" id="f-thana" placeholder="যেমন: তালা" />
          </div>
        </div>

        <div>
          <label class="text-[0.75rem] sm:text-[0.8rem] font-bold tracking-wide uppercase text-muted mb-1.5 block">বিস্তারিত ঠিকানা *</label>
          <textarea class="form-input w-full bg-cream-light border-2 border-[#F5DEB3] rounded-xl px-4 py-3 font-inherit text-sm sm:text-base text-[#2D1810] outline-none transition-all duration-200 focus:border-mango-orange focus:shadow-[0_0_0_4px_rgba(232,145,10,0.1)] placeholder-[#C4B5A0] resize-none" id="f-address" rows="2" placeholder="বাড়ি নম্বর, রোড, এলাকা, ল্যান্ডমার্ক..."></textarea>
        </div>
      </div>

      <button class="pay-btn w-full mt-5 sm:mt-6 bg-gradient-to-br from-mango-orange to-mango-ripe text-white border-0 py-4 px-4 rounded-xl font-inherit text-base sm:text-lg font-bold tracking-wide cursor-pointer transition-all duration-200 flex items-center justify-center gap-2 shadow-[0_4px_16px_rgba(232,145,10,0.3)] hover:translate-y-[-2px] hover:shadow-[0_6px_24px_rgba(232,145,10,0.4)] disabled:opacity-55 disabled:cursor-not-allowed active:scale-[0.98]" id="pay-btn" onclick="checkout()">
        🔒 PayStation-এ পেমেন্ট করুন
      </button>
      <div class="text-center text-xs text-muted mt-3 flex items-center justify-center gap-1">🛡️ SSL এনক্রিপ্টেড · PayStation BD</div>
    </div>
  </div>
</main>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-24 py-3 px-5 sm:py-3.5 sm:px-7 rounded-full text-sm font-medium z-50 transition-transform duration-300 pointer-events-none whitespace-nowrap shadow-[0_4px_20px_rgba(0,0,0,0.18)] max-w-[90vw] text-center"></div>

<script>
const API_BASE = "/api";

const PRODUCTS = {
  p1: { name: "হিমসাগর আম — প্রিমিয়াম",     price: 180, image: "https://images.unsplash.com/photo-1623065422902-30a2d299bbe4?w=600&q=80", desc: "সাতক্ষীরার বিখ্যাত হিমসাগর, মিষ্টি ও সুগন্ধি। প্রতি কেজি।", label: "বেস্টসেলার" },
  p2: { name: "ক্যারামিলমুকুট আম",           price: 220, image: "https://images.unsplash.com/photo-1591073113125-e46713c829ed?w=600&q=80", desc: "গাঢ় ক্যারামেল স্বাদের আম, বিরল প্রজাতি। প্রতি কেজি।", label: "নতুন" },
  p3: { name: "কিং চিলিগাজী আম",             price: 200, image: "https://images.unsplash.com/photo-1553279768-865429fa0078?w=600&q=80", desc: "রাজকীয় আকার ও স্বাদ, চিলিগাজীর সেরা বাগান থেকে। প্রতি কেজি।", label: "জনপ্রিয়" },
  p4: { name: "কাশ জন লোলভাজী আম",          price: 250, image: "https://images.unsplash.com/photo-1601493700631-2b16ec4b4716?w=600&q=80", desc: "বিরল লোলভাজী প্রজাতি, মধু-মিষ্টি স্বাদ। প্রতি কেজি।", label: "নতুন" },
  p5: { name: "হিমসাগর আম — ফ্যামিলি প্যাক", price: 850, image: "https://images.unsplash.com/photo-1557800636-894a64c1696f?w=600&q=80", desc: "৫ কেজি ফ্যামিলি প্যাক, বিশেষ ডিসকাউন্টে।", label: "ফ্যামিলি" },
  p6: { name: "আমের আচার — হাতে তৈরি",      price: 350, image: "https://images.unsplash.com/photo-1596450531560-95a459f72c0c?w=600&q=80", desc: "পাকা আমের ঐতিহ্যবাহী আচার, কোনো প্রিজারভেটিভ নেই। ৫০০গ্রাম।", label: "নতুন" },
  p7: { name: "আমের জুস — তাজা",             price: 180, image: "https://images.unsplash.com/photo-1621506289937-a8e4df240d0b?w=600&q=80", desc: "তাজা হিমসাগর আমের জুস, কোনো চিনি মিশ্রিত নয়। ১ লিটার।", label: "তাজা" },
  p8: { name: "আমের সরবত কনসেনট্রেট",       price: 280, image: "https://images.unsplash.com/photo-1546173159-315724a31696?w=600&q=80", desc: "ঘন সরবত কনসেনট্রেট, পানিতে মিশিয়ে খান। ৫০০মিলি।", label: "নতুন" },
};

let cart = {};

try {
  const saved = sessionStorage.getItem('ambariCart');
  if (saved) cart = JSON.parse(saved);
} catch(e) {}

function validatePhone(phone) {
  const clean = phone.replace(/[^0-9]/g, '');
  return /^01[3-9][0-9]{8}$/.test(clean);
}
function validateEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
}
function setFieldStatus(id, isValid, message) {
  const el = document.getElementById(id);
  const hint = document.getElementById('hint-' + id.replace('f-', ''));
  if (!el) return;
  el.classList.remove('error', 'valid');
  if (hint) { hint.classList.remove('error', 'valid'); hint.textContent = message || ''; }
  if (isValid === true) { el.classList.add('valid'); if (hint) hint.classList.add('valid'); }
  else if (isValid === false) { el.classList.add('error'); if (hint) hint.classList.add('error'); }
}

function saveCart() {
  sessionStorage.setItem('ambariCart', JSON.stringify(cart));
}

function cartTotal() {
  return Object.entries(cart).reduce((s,[pid,qty]) => s + (PRODUCTS[pid]?.price||0)*qty, 0);
}
function cartCount() {
  return Object.values(cart).reduce((a,b) => a+b, 0);
}
function cartPayload() {
  return Object.entries(cart).map(([id,qty]) => ({id,qty}));
}

function adjustQty(pid, delta) {
  const next = (cart[pid] || 0) + delta;
  if (next <= 0) delete cart[pid]; else if (next <= 20) cart[pid] = next;
  saveCart();
  renderCart();
}

function removeItem(pid) {
  delete cart[pid];
  saveCart();
  renderCart();
  toast('❌ পণ্য সরানো হয়েছে');
}

function renderCart() {
  const count = cartCount();
  const itemsContainer = document.getElementById('cart-items');
  const emptyState = document.getElementById('empty-state');
  const checkoutSection = document.getElementById('checkout-section');
  const summary = document.getElementById('cart-summary');

  if (count === 0) {
    itemsContainer.innerHTML = '';
    emptyState.classList.remove('hidden');
    checkoutSection.classList.add('hidden');
    summary.textContent = 'কার্টে কোনো পণ্য নেই';
    return;
  }

  emptyState.classList.add('hidden');
  checkoutSection.classList.remove('hidden');
  summary.textContent = `${count}টি পণ্য · মোট ৳${cartTotal().toLocaleString('en-BD')}`;

  // Render items
  itemsContainer.innerHTML = Object.entries(cart).map(([pid, qty]) => {
    const p = PRODUCTS[pid];
    return `
    <div class="cart-item">
      <div class="w-24 h-24 sm:w-28 sm:h-28 bg-cream rounded-xl overflow-hidden shrink-0">
        <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover" />
      </div>
      <div class="flex-1 min-w-0 item-info">
        <div class="flex items-start justify-between gap-2 mb-1">
          <h3 class="font-bengali text-base sm:text-lg font-bold text-leaf-green leading-snug">${p.name}</h3>
          <button onclick="removeItem('${pid}')" class="text-muted hover:text-red-500 transition-colors text-lg shrink-0 p-1" title="সরান">🗑️</button>
        </div>
        <p class="text-xs sm:text-sm text-muted mb-2 leading-relaxed">${p.desc}</p>
        <div class="flex items-center justify-between gap-4 item-actions">
          <div class="flex items-center gap-2">
            <button class="qty-btn" onclick="adjustQty('${pid}',-1)">−</button>
            <span class="qty-value">${qty}</span>
            <button class="qty-btn" onclick="adjustQty('${pid}',1)">+</button>
          </div>
          <div class="text-right">
            <div class="font-extrabold text-mango-orange text-lg sm:text-xl">৳${(p.price * qty).toLocaleString('en-BD')}</div>
            <div class="text-xs text-muted">৳${p.price.toLocaleString('en-BD')} × ${qty}</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  // Render summary lines
  const summaryLines = document.getElementById('summary-lines');
  summaryLines.innerHTML = Object.entries(cart).map(([pid, qty]) => {
    const p = PRODUCTS[pid];
    return `<div class="flex justify-between text-sm sm:text-base">
      <span class="text-muted">${p.name} <span class="text-xs">× ${qty}</span></span>
      <span class="font-bold text-leaf-green">৳${(p.price * qty).toLocaleString('en-BD')}</span>
    </div>`;
  }).join('');

  document.getElementById('final-total').textContent = cartTotal().toLocaleString('en-BD');
}

function getFbp() { return document.cookie.match(/_fbp=([^;]+)/)?.[1] || null; }
function getFbc() { return document.cookie.match(/_fbc=([^;]+)/)?.[1] || new URLSearchParams(location.search).get('fbclid') || null; }

async function checkout() {
  const fields = ['f-name','f-phone','f-email','f-division','f-jela','f-upojela','f-thana','f-address'];
  fields.forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.classList.remove('error', 'valid', 'border-red-500'); el.classList.add('border-[#F5DEB3]'); }
  });

  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const division = document.getElementById('f-division').value.trim();
  const jela = document.getElementById('f-jela').value.trim();
  const upojela = document.getElementById('f-upojela').value.trim();
  const thana = document.getElementById('f-thana').value.trim();
  const address = document.getElementById('f-address').value.trim();

  let err = false;
  if (!name) { setFieldStatus('f-name', false, ''); err = true; } else { setFieldStatus('f-name', true, ''); }
  if (!phone) { setFieldStatus('f-phone', false, 'ফোন নম্বর দিন'); err = true; }
  else if (!validatePhone(phone)) { setFieldStatus('f-phone', false, 'সঠিক বাংলাদেশি মোবাইল নম্বর দিন (01XXXXXXXXX)'); err = true; }
  else { setFieldStatus('f-phone', true, '✓ সঠিক'); }
  if (!email) { setFieldStatus('f-email', false, 'ইমেইল দিন'); err = true; }
  else if (!validateEmail(email)) { setFieldStatus('f-email', false, 'সঠিক ইমেইল ফরম্যাট দিন'); err = true; }
  else { setFieldStatus('f-email', true, '✓ সঠিক'); }
  if (!division) { setFieldStatus('f-division', false, ''); err = true; } else { setFieldStatus('f-division', true, ''); }
  if (!jela) { setFieldStatus('f-jela', false, ''); err = true; } else { setFieldStatus('f-jela', true, ''); }
  if (!upojela) { setFieldStatus('f-upojela', false, ''); err = true; } else { setFieldStatus('f-upojela', true, ''); }
  if (!thana) { setFieldStatus('f-thana', false, ''); err = true; } else { setFieldStatus('f-thana', true, ''); }
  if (!address) { setFieldStatus('f-address', false, ''); err = true; } else { setFieldStatus('f-address', true, ''); }

  if (err) { toast('সব ঘর সঠিকভাবে পূরণ করুন', true); return; }
  if (cartCount() === 0) { toast('কার্ট খালি', true); return; }

  const btn = document.getElementById('pay-btn');
  const originalBtnText = btn.innerHTML;
  btn.disabled = true;
  btn.textContent = '⏳ PayStation-এ সংযুক্ত হচ্ছে…';

  try {
    const res = await fetch(API_BASE + '/initiate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        items: cartPayload(),
        cust_name: name,
        cust_phone: phone,
        cust_email: email,
        division, jela, upojela, thana,
        address_detail: address,
        fbp: getFbp(),
        fbc: getFbc(),
        event_id: 'ic-' + Date.now(),
      }),
    });
    const data = await res.json();

    if (data.payment_url) {
      sessionStorage.setItem('lastOrder', JSON.stringify({
        invoice: data.invoice_number, name, amount: cartTotal(),
        items: Object.entries(cart).map(([pid,qty]) => ({ name: PRODUCTS[pid].name, image: PRODUCTS[pid].image, qty, price: PRODUCTS[pid].price })),
      }));
      window.location.href = data.payment_url;
    } else {
      toast(data.error || 'পেমেন্ট ব্যর্থ হয়েছে। আবার চেষ্টা করুন।', true);
      btn.disabled = false;
      btn.innerHTML = originalBtnText;
    }
  } catch (e) {
    toast('নেটওয়ার্ক ত্রুটি। আবার চেষ্টা করুন।', true);
    btn.disabled = false;
    btn.innerHTML = originalBtnText;
  }
}

let _tt;
function toast(msg, isErr=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-0 py-3 px-5 sm:py-3.5 sm:px-7 rounded-full text-sm font-medium z-50 transition-transform duration-300 pointer-events-none whitespace-nowrap shadow-[0_4px_20px_rgba(0,0,0,0.18)] max-w-[90vw] text-center text-white ${isErr ? 'bg-[#C0392B]' : 'bg-leaf-green'}`;
  clearTimeout(_tt);
  _tt = setTimeout(() => { el.classList.remove('translate-y-0'); el.classList.add('translate-y-24'); }, 3200);
}

function setupLiveValidation() {
  const phoneEl = document.getElementById('f-phone');
  const emailEl = document.getElementById('f-email');
  if (phoneEl) {
    phoneEl.addEventListener('input', function() {
      this.value = this.value.replace(/[^0-9]/g, '');
      if (this.value.length > 11) this.value = this.value.slice(0, 11);
      if (this.value.length > 0) {
        if (validatePhone(this.value)) setFieldStatus('f-phone', true, '✓ সঠিক');
        else setFieldStatus('f-phone', false, '01 দিয়ে শুরু, ১১ সংখ্যা');
      } else { setFieldStatus('f-phone', null, ''); }
    });
  }
  if (emailEl) {
    emailEl.addEventListener('input', function() {
      if (this.value.length > 0) {
        if (validateEmail(this.value)) setFieldStatus('f-email', true, '✓ সঠিক');
        else setFieldStatus('f-email', false, 'সঠিক ইমেইল ফরম্যাট');
      } else { setFieldStatus('f-email', null, ''); }
    });
  }
}

renderCart();
setupLiveValidation();
</script>
</body>
