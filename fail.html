<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অর্ডার ব্যর্থ</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#fef2f2; /* Light red background */
}

.card{
    background:white;
    padding:40px 30px;
    border-radius:16px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    max-width:400px;
}

.check{
    font-size:60px;
}

h1{
    color:#dc2626; /* Red for failure */
    margin:15px 0;
}

p{
    color:#555;
    line-height: 1.5;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 24px;
    background:#dc2626;
    color:white;
    text-decoration:none;
    border-radius:8px;
    transition: background 0.2s;
}

.btn:hover{
    background:#b91c1c;
}
</style>
</head>
<body>

<div class="card">
    <div class="check">❌</div>
    <h1>অর্ডার ব্যর্থ হয়েছে</h1>
    <p>
        দুঃখিত, আপনার অর্ডারটি সম্পন্ন করা যায়নি। 
        অনুগ্রহ করে আবার চেষ্টা করুন বা সাপোর্টের সাথে যোগাযোগ করুন।
    </p>

    <a href="/" class="btn">আবার চেষ্টা করুন</a>
</div>

</body>
</html>
