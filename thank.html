    font-family: Arial, sans-serif;
    background:#f5fff7;
    min-height:100vh;
    display:flex;

    justify-content:center;

    background:#fff;

    color:#555;
    line-height:1.6;
}

    display:inline-block;

    border-radius:8px;

    <p>
        ধন্যবাদ। আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে।
