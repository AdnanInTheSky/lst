<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>অর্ডার সফল</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#f5fff7;
}

.card{
    background:white;
    padding:40px 30px;
    border-radius:16px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    max-width:400px;
}

.check{
    font-size:60px;
}

h1{
    color:#166534;
    margin:15px 0;
}

p{
    color:#555;
}

.btn{
    display:inline-block;
    margin-top:20px;
    padding:12px 24px;
    background:#166534;
    color:white;
    text-decoration:none;
    border-radius:8px;
}
</style>
</head>
<body>

<div class="card">
    <div class="check"></div>
    <h1>অর্ডার সফল হয়েছে</h1>
    <p>
        ধন্যবাদ। আপনার অর্ডারটি গ্রহণ করা হয়েছে।
        আমরা শীঘ্রই আপনার সাথে যোগাযোগ করব।
    </p>

    <a href="/" class="btn">হোমে ফিরুন</a>
</div>

</body>
</html>
